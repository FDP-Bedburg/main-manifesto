# Hugo configuration file
title: Grundsatzprogramm der FDP Bedburg (Entwurf)

defaultContentLanguage: de
languages:
  de:
    languageName: Deutsch
    weight: 1

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Grundsatzprogramm
      pageRef: /programm
      weight: 1
    - name: Über uns
      pageRef: /about
      weight: 2
    - name: Homepage ↗
      url: "https://www.fdp-bedburg.de"
      weight: 3
    - name: Suche
      weight: 4
      params:
        type: search
    - name: Instagram
      weight: 5
      url: "https://www.instagram.com/fdp_bedburg/"
      params:
        icon: instagram
    - name: Facebook
      weight: 6
      url: "https://www.facebook.com/fdp.bedburg/"
      params:
        icon: facebook

params:
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/fdp.png
      dark: images/fdp.png
      link: /
      width: 110
      height: 20
    favicon:
      path: images/favicon.png

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
